<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f5f6f8;
    color:#171717;
}

button,input{
    font:inherit;
}

header{
    background:#111827;
    color:white;
    padding:22px 16px 18px;
}

.header-container,
.container{
    max-width:900px;
    margin:auto;
}

.title{
    font-size:25px;
    font-weight:800;
}

.subtitle{
    margin-top:5px;
    color:#cbd5e1;
    font-size:14px;
}

.progress-container{
    margin-top:18px;
}

.progress-background{
    width:100%;
    height:9px;
    background:#ffffff25;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:white;
    border-radius:20px;
    transition:.3s;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
    font-size:12px;
    color:#cbd5e1;
}

.container{
    padding:15px;
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 0 15px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex-shrink:0;
    border:1px solid #ddd;
    background:white;
    padding:10px 15px;
    border-radius:25px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
}

.tab.active{
    background:#111827;
    color:white;
    border-color:#111827;
}

.track{
    display:none;
}

.track.active{
    display:block;
}

.track-title{
    font-size:22px;
    font-weight:800;
}

.track-description{
    color:#6b7280;
    font-size:13px;
    margin-top:5px;
}

.track-progress{
    margin-top:8px;
    font-size:13px;
    font-weight:600;
}

.playlist-button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#111827;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    margin:15px 0;
}

.day-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    margin-bottom:15px;
    overflow:hidden;
}

.day-card.completed{
    border-color:#9ca3af;
}

.day-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px;
}

.day-number{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    flex-shrink:0;
}

.day-name{
    font-weight:750;
    font-size:16px;
}

.day-status{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.section-label{
    padding:10px 16px;
    background:#f8f8f8;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    font-size:12px;
    font-weight:700;
    color:#555;
    text-transform:uppercase;
}

.tasks{
    padding:0 16px 12px;
}

.task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #f0f0f0;
    font-size:14px;
    cursor:pointer;
}

.task:last-child{
    border-bottom:none;
}

.task input{
    width:19px;
    height:19px;
    flex-shrink:0;
    cursor:pointer;
}

.task.completed span{
    text-decoration:line-through;
    color:#9ca3af;
}

.resources{
    background:#fafafa;
    border-top:1px solid #eee;
    padding:12px 16px 15px;
}

.resources-title{
    font-size:12px;
    color:#777;
    margin-bottom:7px;
}

.resource-link{
    display:inline-block;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:8px 11px;
    border-radius:8px;
    font-size:12px;
}

.output{
    padding:12px 16px;
    background:#f9fafb;
    border-top:1px solid #eee;
    font-size:13px;
}

.output strong{
    display:block;
    margin-bottom:4px;
}

.actions{
    display:flex;
    gap:8px;
    margin:20px 0 40px;
}

.action-button{
    border:1px solid #ddd;
    background:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
}

@media(max-width:600px){

    .title{
        font-size:21px;
    }

    .container{
        padding:12px;
    }

    .day-name{
        font-size:14px;
    }

    .task{

    }

        justify-content:center;
    }

    .action-button{

/* =========================================================
   PROGRESS STORAGE
========================================================= */

let progress =
JSON.parse(
localStorage.getItem("tanyaTechPlanner")
) || {};

let currentTrack = "ai";


/* =========================================================
   SAVE
========================================================= */

function saveProgress(){

localStorage.setItem(
"tanyaTechPlanner",
JSON.stringify(progress)
);

}


/* =========================================================
   TASK ID
========================================================= */

function taskId(
trackId,
dayIndex,
taskIndex
){

return `${trackId}-${dayIndex}-${taskIndex}`;

}


/* =========================================================
   DAY COMPLETE
========================================================= */

function isDayComplete(
track,
dayIndex
){

return track.days[
dayIndex
].tasks.every(
(_,taskIndex)=>
progress[
taskId(
track.id,
dayIndex,
taskIndex
)
] === true
);

}


/* =========================================================
   COMPLETED DAYS
========================================================= */

function completedDays(){

let count=0;

tracks.forEach(track=>{

track.days.forEach(
(_,dayIndex)=>{

if(
isDayComplete(
track,
dayIndex
)
){

count++;

}

});

});

return count;

}


/* =========================================================
   GLOBAL PROGRESS
========================================================= */

function updateProgress(){

const completed =
completedDays();

const percent =
Math.round(
(completed/40)*100
);

document.getElementById(
"progressBar"
).style.width =
percent+"%";

document.getElementById(
"progressPercent"
).textContent =
percent+"%";

document.getElementById(
"progressCount"
).textContent =
`${completed} / 40 days`;

}


/* =========================================================
   RENDER TABS
========================================================= */

function renderTabs(){

const tabs =
document.getElementById(
"tabs"
);

tabs.innerHTML="";

tracks.forEach(track=>{

const button =
document.createElement(
"button"
);

button.className =
"tab"+
(
track.id===currentTrack
?" active"
:""
);

button.textContent =
track.name;

button.onclick=()=>{

currentTrack=
track.id;

render();

};

tabs.appendChild(
button
);

});

}


/* =========================================================
   RENDER CONTENT
========================================================= */

function renderContent(){

const content =
document.getElementById(
"content"
);

content.innerHTML="";


tracks.forEach(track=>{

const section =
document.createElement(
"section"
);

section.className =
"track"+
(
track.id===currentTrack
?" active"
:""
);


const done =
track.days.filter(
(_,index)=>
isDayComplete(
track,
index
)
).length;


section.innerHTML=`

<div class="track-title">
${track.name}
</div>

<div class="track-description">
${track.description}
</div>

<div class="track-progress">
${done}/10 days completed
</div>

<a
class="playlist-button"
href="${track.playlist}"
target="_blank"
rel="noopener"
>
▶ Open YouTube Playlist
</a>

`;


track.days.forEach(
(day,dayIndex)=>{

const card =
document.createElement(
"div"
);

const completed =
isDayComplete(
track,
dayIndex
);

card.className =
"day-card"+
(
completed
?" completed"
:""
);


const completedTasks =
day.tasks.filter(
(_,taskIndex)=>
progress[
taskId(
track.id,
dayIndex,
taskIndex
)
]
).length;


card.innerHTML=`

<div class="day-header">

<div class="day-number">
${dayIndex+1}
</div>

<div>

<div class="day-name">
Day ${dayIndex+1} —
${day.title}
</div>

<div class="day-status">
${completedTasks}/${day.tasks.length}
subtopics completed
</div>

</div>

</div>

<div class="section-label">
📚 Important Subtopics
</div>

<div class="tasks"></div>

<div class="output">

<strong>
🎯 Day Output
</strong>

${day.output}

</div>

<div class="resources">

<div class="resources-title">
🎥 Learning Resource
</div>

<a
class="resource-link"
href="${track.playlist}"
target="_blank"
rel="noopener"
>
YouTube
</a>

</div>

`;


const taskContainer =
card.querySelector(
".tasks"
);


day.tasks.forEach(
(task,taskIndex)=>{

const key =
taskId(
track.id,
dayIndex,
taskIndex
);

const checked =
progress[key]===true;


const label =
document.createElement(
"label"
);

label.className =
"task"+
(
checked
?" completed"
:""
);


label.innerHTML=`

<input
type="checkbox"
${checked?"checked":""}
/>

<span>
${task}
</span>

`;


const checkbox =
label.querySelector(
"input"
);


checkbox.addEventListener(
"change",
()=>{

progress[key]=
checkbox.checked;

saveProgress();

render();

});

taskContainer.appendChild(
label
);

});


section.appendChild(
card
);

});


content.appendChild(
section
);

});

}


/* =========================================================
   COMPLETE NEXT DAY
========================================================= */

function completeNextDay(){

const track =
tracks.find(
track=>
track.id===currentTrack
);

const next =
track.days.findIndex(
(_,index)=>
!isDayComplete(
track,
index
)
);

if(next===-1){

alert(
"All 10 days of this track are complete! 🎉"
);

return;

}


track.days[
next
].tasks.forEach(
(_,taskIndex)=>{

progress[
taskId(
track.id,
next,
taskIndex
)
]=true;

});


saveProgress();

render();

}


/* =========================================================
   RESET
========================================================= */

function resetProgress(){

const confirmReset =
confirm(
"Are you sure you want to reset all 40 days?"
);

if(!confirmReset)
return;

progress={};

saveProgress();

render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

renderTabs();

renderContent();

updateProgress();

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
